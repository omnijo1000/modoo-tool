<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="robots" content="noindex,nofollow">

<meta charset="UTF-8">
<title>modoohub 카드뉴스 샘플 — 검정/보라·시안 시스템</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #050505; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 40px 0; }

  /* card-news-typeA.html과 동일한 프리뷰 크기(432x540)로 비교하기 위한 스케일 래퍼.
     실제 출력은 여전히 1080x1350 — 여기선 0.4배로 축소 렌더링만 함(비율 동일). */
  .preview {
    position: relative;
    width: 432px;
    height: 540px;
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.7);
  }
  .canvas {
    position: absolute;
    top: 0; left: 0;
    width: 1080px;
    height: 1350px;
    transform: scale(0.4);
    transform-origin: top left;
    background: #0a0a0a;
    overflow: hidden;
    font-family: 'Noto Sans KR', sans-serif;
  }
  /* 미세 그리드 (4% 불투명도) */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 44px 44px;
  }
  /* 비대칭 라디얼 글로우 — 보라 상단우측 / 시안 하단좌측 */
  .glow-purple {
    position: absolute; top: -180px; right: -160px;
    width: 620px; height: 620px; border-radius: 9999px;
    background: #8B7CFA; filter: blur(180px); opacity: 0.30;
  }
  .glow-cyan {
    position: absolute; bottom: -200px; left: -180px;
    width: 640px; height: 640px; border-radius: 9999px;
    background: #3FD8C8; filter: blur(190px); opacity: 0.24;
  }

  /* 글래스 카드 패널 — 신규 시스템에서 가져온 구조 */
  .glass {
    position: absolute; inset: 40px;
    border-radius: 40px;
    background: rgba(255,255,255,0.035);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    border: 1px solid rgba(255,255,255,0.08);
    display: flex; flex-direction: column;
    padding: 72px 64px;
  }

  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 56px; }
  .brand img { width: 34px; height: 34px; object-fit: contain; }
  .brand span {
    font-size: 22px; font-weight: 700; letter-spacing: 0.02em;
    background: linear-gradient(90deg, #8B7CFA, #3FD8C8);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .indicator {
    margin-left: auto;
    font-family: 'DM Mono', monospace;
    font-size: 15px; color: #666;
    border: 1px solid #262626; border-radius: 9999px;
    padding: 5px 14px;
  }

  .badge {
    align-self: flex-start;
    font-size: 17px; font-weight: 700; color: #fbbf24;
    background: rgba(251,191,36,0.08);
    border: 1px solid rgba(251,191,36,0.3);
    border-radius: 9999px;
    padding: 9px 20px;
    margin-bottom: 36px;
  }

  .hero-num {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 200px;
    line-height: 0.95;
    color: #fbbf24;
    margin-bottom: 28px;
  }

  h1 {
    font-family: 'Black Han Sans', sans-serif;
    font-weight: 400;
    font-size: 58px;
    line-height: 1.32;
    color: #f5f5f5;
    margin-bottom: 24px;
  }

  .sub {
    font-size: 27px;
    line-height: 1.7;
    color: #888;
    max-width: 780px;
  }

  .foot {
    margin-top: auto;
    padding-top: 40px;
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .foot-url {
    font-family: 'DM Mono', monospace;
    font-size: 20px; color: #4ade80;
  }
  .foot-tag {
    font-family: 'DM Mono', monospace;
    font-size: 16px; color: #555;
  }
</style>
</head>
<body>

<div class="preview">
<div class="canvas">
  <div class="grid"></div>
  <div class="glow-purple"></div>
  <div class="glow-cyan"></div>

  <div class="glass">
    <div class="brand">
      <img src="../assets/modoohub-logo-icon.png" alt="modoohub">
      <span>MODOO HUB</span>
      <span class="indicator">01 / 05</span>
    </div>

    <div class="badge">국세기본법 제54조</div>

    <div class="hero-num">5년</div>

    <h1>신고 안 하면,<br>이미 낸 세금이<br>국가로 사라집니다</h1>

    <p class="sub">국세환급금 소멸시효는 5년.<br>기한이 지나면 내 돈이어도 더 이상 청구할 수 없어요.</p>

    <div class="foot">
      <span class="foot-tag">무료 · 가입 불필요</span>
      <span class="foot-url">modoohub.com/income-tax.html</span>
    </div>
  </div>
</div>
</div>

</body>
</html>
